# Starts the whole app with one command:  docker compose up --build
# Then open http://localhost:8080
#
# Secrets come from the .env file next to this one (copy .env.example first).

services:
  # ---- PostgreSQL database ----
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
    volumes:
      - db-data:/var/lib/postgresql/data # data survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No "ports": the database is only reachable by the API, not from outside.

  # ---- Express API ----
  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy # wait until PostgreSQL accepts connections
    environment:
      DB_HOST: db # the service name above
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-taskuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-taskmanager}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_ORIGIN: http://localhost:8080
    ports:
      - "5050:5000" # API on http://localhost:5050 (5000 stays free for local dev)

  # ---- React front end (served by Nginx) ----
  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5050
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  db-data:
