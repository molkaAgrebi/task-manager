# Render "Blueprint": deploys the database, the API and the front end in one go.
# On render.com: New > Blueprint > pick this repository.
# You will be asked for the two values marked "sync: false".

databases:
  - name: task-manager-db
    plan: free
    databaseName: taskmanager
    user: taskuser

services:
  # ---- Express API ----
  - type: web
    name: task-manager-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 1
      - key: JWT_SECRET
        generateValue: true # Render creates a random secret
      - key: CLIENT_ORIGIN
        sync: false # e.g. https://task-manager-client.onrender.com
      - key: DB_HOST
        fromDatabase: { name: task-manager-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: task-manager-db, property: port }
      - key: DB_USER
        fromDatabase: { name: task-manager-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: task-manager-db, property: password }
      - key: DB_NAME
        fromDatabase: { name: task-manager-db, property: database }

  # ---- React front end (static files) ----
  - type: web
    name: task-manager-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://task-manager-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
